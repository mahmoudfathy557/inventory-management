<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      .navy-bg { fill: #112a5d; }
      .white-bg { fill: #ffffff; }
      .white-strand {
        fill: none;
        stroke: #ffffff;
        stroke-width: 34;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .strand-gap {
        fill: none;
        stroke: #112a5d;
        stroke-width: 44;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand-en {
        font-family: 'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif;
        font-size: 60px;
        font-weight: 600;
        letter-spacing: 0.2px;
        fill: #112a5d;
      }
      .brand-ar {
        font-family: 'Aref Ruqaa', 'Cairo', 'Amiri', 'Traditional Arabic', serif;
        font-size: 68px;
        font-weight: 700;
        fill: #112a5d;
      }
    </style>
  </defs>

  <!-- Clean Background -->
  <rect width="1000" height="1000" class="white-bg" />

  <!-- Monogram AP -->
  <g id="ap-monogram" transform="translate(0, 5)">
    <!-- Base Solid Navy Silhouette for A and P -->
    <path class="navy-bg" d="
      M 168,585
      L 326,175
      L 645,175
      C 745,175 826,230 826,298
      C 826,366 745,416 645,416
      L 622,416
      L 622,585
      L 528,585
      L 528,478
      L 475,478
      L 380,478
      L 336,585
      Z
    " />

    <!-- A's Inner Triangular Counter Hole -->
    <polygon points="314,418 365,272 416,418" class="white-bg" />

    <!-- P's Inner Loop Counter Hole -->
    <path class="white-bg" d="
      M 622,246
      L 655,246
      C 710,246 745,268 745,298
      C 745,328 710,350 655,350
      L 622,350
      Z
    " />

    <!-- Upper Notch (Cleft between A and P at the top) -->
    <path class="white-bg" d="
      M 414,170
      C 435,210 465,236 465,246
      C 465,236 495,210 516,170
      Z
    " />

    <!-- Lower Notch (Cleft between A and P at the bottom) -->
    <path class="white-bg" d="
      M 418,590
      C 440,545 465,525 465,515
      C 465,525 490,545 512,590
      Z
    " />

    <!-- Negative Space Cutout to shape the left contour of the helix into A -->
    <path class="white-bg" d="
      M 390,478
      C 392,448 402,428 416,418
      L 416,478
      Z
    " />

    <!-- 3D Intertwined Double-Helix Polymer Strands -->
    <!-- Layer 1: Under-passing strand segments -->
    <!-- Crossover 1: Strand 2 passes under Strand 1 -->
    <path class="strand-gap" d="M 420,175 C 440,205 455,225 465,245" />
    <path class="white-strand" d="M 418,175 C 438,205 452,225 465,245" />

    <!-- Crossover 1: Strand 1 passes OVER Strand 2 -->
    <path class="white-strand" d="
      M 512,175
      C 490,205 476,225 465,245
      C 445,275 408,305 408,336
      C 408,358 425,372 465,382
    " />

    <!-- Crossover 2: Strand 1 passes under Strand 2 -->
    <path class="strand-gap" d="M 465,382 C 485,392 522,418 522,448 C 522,478 485,508 465,518" />
    <path class="white-strand" d="M 465,382 C 485,392 522,418 522,448 C 522,478 485,508 465,518" />

    <!-- Crossover 2: Strand 2 passes OVER Strand 1 -->
    <path class="white-strand" d="
      M 465,245
      C 485,275 522,305 522,336
      C 522,358 505,372 465,382
      C 425,392 408,418 408,448
      C 408,478 445,508 465,518
    " />

    <!-- Crossover 3: Strand 2 passes under Strand 1 -->
    <path class="strand-gap" d="M 465,518 C 485,528 502,558 510,588" />
    <path class="white-strand" d="M 465,518 C 485,528 502,558 510,588" />

    <!-- Crossover 3: Strand 1 passes OVER Strand 2 to exit -->
    <path class="white-strand" d="M 465,518 C 445,528 428,558 420,588" />
  </g>

  <!-- English Brand Typography -->
  <text x="500" y="705" text-anchor="middle" class="brand-en">Arab Co. For Plastic</text>

  <!-- Arabic Brand Calligraphy -->
  <text x="500" y="805" text-anchor="middle" class="brand-ar">الشركة العربية للدائن</text>
</svg>