<!doctype html>

    <meta charset="UTF-8" />
    <script>
      // 1. Mock Vite HMR WebSocket so @vite/client in AI Studio iframe connects cleanly without error
      (function() {
        if (typeof window === 'undefined') return;
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          function DummyViteWebSocket(url, protocols) {
            const urlStr = String(url || '');
            const protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (urlStr.includes('vite') || protoStr.includes('vite') || urlStr.includes('24678') || urlStr.includes('token=')) {
              const target = new EventTarget();
              target.url = urlStr;
              target.protocols = protocols;
              target.readyState = 0; // CONNECTING
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function() {};
              target.close = function() {
                target.readyState = 3;
                target.dispatchEvent(new Event('close'));
              };
              setTimeout(() => {
                target.readyState = 1; // OPEN
                target.dispatchEvent(new Event('open'));
              }, 5);
              return target;
            }
            return new OriginalWebSocket(url, protocols);
          }
          DummyViteWebSocket.prototype = OriginalWebSocket.prototype;
          DummyViteWebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          DummyViteWebSocket.OPEN = OriginalWebSocket.OPEN;
          DummyViteWebSocket.CLOSING = OriginalWebSocket.CLOSING;
          DummyViteWebSocket.CLOSED = OriginalWebSocket.CLOSED;
          window.WebSocket = DummyViteWebSocket;
        }

        function isViteArtifact(args) {
          for (let i = 0; i < args.length; i++) {
            const item = args[i];
            if (!item) continue;
            let str = '';
            if (typeof item === 'string') {
              str = item;
            } else if (item instanceof Error) {
              str = (item.message || '') + ' ' + (item.stack || '');
            } else {
              try { str = JSON.stringify(item); } catch(e) { str = String(item); }
            }
            const lower = str.toLowerCase();
            if (
              str.includes('[vite]') ||
              str.includes('/@vite/') ||
              str.includes('vite-hmr') ||
              lower.includes('websocket') ||
              (lower.includes('vite') && (lower.includes('connect') || lower.includes('failed')))
            ) {
              return true;
            }
          }
          return false;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && isViteArtifact([event.reason])) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && isViteArtifact([event.message, event.error])) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <script>
      // 2. Wrap console in body after _aistudio-iframe.js executes to completely filter [vite] noise
      (function() {
        if (typeof window === 'undefined' || !window.console) return;

        function isViteMsg(args) {
          for (let i = 0; i < args.length; i++) {
            const item = args[i];
            if (!item) continue;
            let str = '';
            if (typeof item === 'string') {
              str = item;
            } else if (item instanceof Error) {
              str = (item.message || '') + ' ' + (item.stack || '');
            } else {
              try { str = JSON.stringify(item); } catch(e) { str = String(item); }
            }
            const lower = str.toLowerCase();
            if (
              str.includes('[vite]') ||
              str.includes('/@vite/') ||
              str.includes('vite-hmr') ||
              lower.includes('websocket') ||
              (lower.includes('vite') && (lower.includes('connect') || lower.includes('failed')))
            ) {
              return true;
            }
          }
          return false;
        }

        const methods = ['error', 'warn', 'debug', 'log', 'info'];
        methods.forEach(function(m) {
          if (typeof window.console[m] === 'function') {
            const orig = window.console[m];
            window.console[m] = function(...args) {
              if (isViteMsg(args)) {
                return;
              }
              return orig.apply(this, args);
            };
          }
        });
      })();
    </script>
