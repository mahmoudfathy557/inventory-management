services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8082
      NODE_ENV: production
      # The database lives on the shared PostgreSQL server; each project gets its
      # own database and role there (ayman_erp / ayman_user).
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_random_jwt_secret_key_in_coolify}
      JWT_EXPIRES_IN: 7d
    ports:
      - "8082"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8082/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - inventory_network

networks:
  inventory_network:
    driver: bridge
