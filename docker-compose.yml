version: "3.8"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-inventory_user} -d ${POSTGRES_DB:-inventory_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: postgres://${POSTGRES_USER:-inventory_user}:${POSTGRES_PASSWORD:-inventory_secure_password}@postgres:5432/${POSTGRES_DB:-inventory_db}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d

    ports:
      - "3000:3000"

volumes:
  postgres_data:
